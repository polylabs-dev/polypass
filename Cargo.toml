[workspace]
resolver = "2"
members = ["crates/poly-pass-core", "crates/poly-pass-wasm"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "LicenseRef-PolyQuantum-Commercial"
repository = "https://github.com/polylabs-dev/polypass"

[workspace.dependencies]
ml-kem = "0.2"
aes-gcm = "0.10"
sha3 = "0.10"
blake3 = "1"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rand = "0.8"
bytes = "1"
thiserror = "1"
