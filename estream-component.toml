[package]
name = "@polyqlabs/qpass"
version = "0.12.0"
description = "PQ password manager — SPARK biometric vault, credential autofill, breach monitoring, TOTP/HOTP, and RBAC"
license = "LicenseRef-PolyQuantum-Commercial"
repository = "https://github.com/polylabs-dev/qpass"

[publisher]
id = "polylabs-dev"
name = "PolyQ Labs"
signing_key_id = "polyqlabs-prime-v1"

[flir]
api_version = "0.22.0"
min_platform_version = "0.22.0"

[dependencies]
qkit = ">=0.3.0"
estream-spark-auth = ">=0.11.0"
estream-eslite = ">=0.11.0"
estream-rbac = ">=0.11.0"

[pricing]
license_type = "per-seat"
share_price = "2.99"
private_price = "4.99"

[telemetry]
schema_hash = "auto"

[telemetry.metrics]
vault_operations = "counter"
credential_stores = "counter"
autofill_events = "counter"
breach_checks = "counter"
share_grants = "counter"
encrypt_ops = "counter"
totp_generations = "counter"
rbac_checks = "counter"
import_operations = "counter"
key_rotations = "counter"

[telemetry.privacy]
aggregate_window = "1h"
cohort_min_size = 50
noise_budget = "1.0"

[component.include]
circuits = ["circuits/fl/*.fl", "circuits/fl/graphs/*.fl"]
tests = ["test_vectors/*.esz"]
docs = ["docs/*.md"]
