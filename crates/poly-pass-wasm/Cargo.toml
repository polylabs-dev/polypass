[package]
name = "poly-pass-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM entry point for Poly Pass — browser-side PQ password manager"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
poly-pass-core = { path = "../poly-pass-core" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
hex = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
